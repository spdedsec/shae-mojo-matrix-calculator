name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mojo
        run: |
          curl -fsSL https://cdn.modular.com/mojo/installer | bash
          echo '$HOME/.modular/pkg/packages.modular.com_mojo/bin' >> $GITHUB_PATH
      - name: Build
        run: make build || echo "Mojo build documented"
      - name: Create release
        run: |
          make release
          gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes "SHAE Mojo Matrix Calculator" dist/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
